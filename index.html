<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T435D Probe Copier</title><style>body{font-family:sans-serif;max-width:900px;margin:20px auto;padding:0 12px}button{font-size:22px;padding:16px 22px;margin:12px 0}textarea{width:100%;height:240px;font-family:monospace;font-size:14px}#status{font-weight:bold;margin:12px 0}</style><h1>T435D read-only probe copier</h1><p>Press the button on the TCL, then paste the copied URL into your re-entry flow.</p><button id="copy">Copy probe URL to clipboard</button><div id="status"></div><textarea id="url"></textarea><script>
const props=["ro.build.type","ro.secure","ro.adb.secure","ro.debuggable","sys.usb.config","persist.service.adb.enable","service.adb.root"];
const ph="<meta name=viewport content='width=device-width,initial-scale=1'><pre id=o>Reading localhost:2929...</pre><script>p="+JSON.stringify(props)+";Promise.all(p.map(k=>fetch('http://127.0.0.1:2929',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'name=query&api=get_sys_property&key='+encodeURIComponent(k)}).then(r=>r.text()).then(v=>k+'\\n'+v))).then(x=>o.textContent=x.join('\\n\\n')).catch(e=>o.textContent='ERROR '+e)<\/script>";
const dataUrl='data:text/html,'+encodeURIComponent(ph);
url.value=dataUrl;
copy.onclick=async()=>{url.focus();url.select();try{await navigator.clipboard.writeText(dataUrl);status.textContent='Copied to clipboard.'}catch(e){document.execCommand('copy');status.textContent='Copied using fallback.'}}
</script>
